benchmark: gdpval
tasks:
  path: ./gdpval-one-task.jsonl
  limit: 1
  seed: 42
repeats: 1
limits:
  max_tasks: 1
  max_retries: 0
  concurrency: 1
application:
  executor: codex
  model: gpt-5.6-luna
  settings:
    reasoning_effort: medium
    timeout_seconds: 600
conditions:
  - id: baseline
    intervention: null
evaluation:
  method: scalar
  executor: codex
  model: gpt-5.6-luna
  settings:
    reasoning_effort: medium
    timeout_seconds: 600
