[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness"
version = "0.1.0"
description = "A small account-authenticated CLI harness for reproducible agent evaluations"
readme = "README.md"
requires-python = ">=3.13.14"
license = { text = "Apache-2.0" }
authors = [{ name = "NVIDIA" }]
dependencies = [
    "PyYAML>=6.0.2,<7",
    "openpyxl>=3.1.5,<4",
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "Pillow>=12.3,<13",
    "xlsxwriter>=3.2,<4",
    "packaging>=25,<27",
]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[project.optional-dependencies]
capabilities = [
    "cadquery-ocp>=7.9.3.1.1,<8",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.10,<4",
    "nbformat>=5.10,<6",
    "numpy>=2.2,<3",
    "pandas>=2.3,<4",
    "psd-tools>=1.12,<2",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "setuptools==83.0.0",
    "types-openpyxl>=3.1.5,<4",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 119
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["eval_harness"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
