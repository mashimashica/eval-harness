name: Eval Harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Harness quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@45c121f982720f3bdf236c2ac06f126ca211949c
        with:
          version: '0.12.13'
          python-version: '3.13.14'
      - name: Install locked local harness
        run: uv sync --project harness --locked --no-editable
      - name: Lint and type check
        run: |
          uv run --project harness --no-sync ruff check harness
          uv run --project harness --no-sync ruff format --check harness
          uv run --project harness --no-sync mypy --config-file harness/pyproject.toml harness/src/eval_harness
      - name: Behavioral tests and measured coverage
        run: uv run --project harness --no-sync pytest -c harness/pyproject.toml harness/tests --cov=eval_harness --cov-report=term-missing --cov-fail-under=0
      - name: Dependency audit
        run: uv run --project harness --no-sync pip-audit --local
      - name: Documentation links
        run: python3 tests/unit_tests/test_fern_docs_links.py
      - name: Fern configuration
        working-directory: fern
        run: npx --yes fern-api@5.121.0 check
      - name: Install verified secret scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan submitted changes for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE_SHA" && git cat-file -e "$BASE_SHA^{commit}"; then
            /tmp/gitleaks git --redact --log-opts="$BASE_SHA..HEAD" .
          else
            /tmp/gitleaks git --redact --log-opts='-1' .
          fi
