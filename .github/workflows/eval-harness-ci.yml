name: Eval Harness CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eval-harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.14"
  UV_VERSION: "0.11.29"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare artifact directory
        run: mkdir -p ci-artifacts/lint

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install and verify Python
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(tr -d '[:space:]' < .python-version)" = "${PYTHON_VERSION}"
          unset UV_PYTHON
          uv python install
          test "$(uv run --no-project --python "${PYTHON_VERSION}" python --version)" = "Python ${PYTHON_VERSION}"

      - name: Run pre-commit lint
        run: |
          set -euo pipefail
          export UV_PYTHON="${PYTHON_VERSION}"
          uvx --from "pre-commit==4.3.0" pre-commit run --all-files --show-diff-on-failure --color=always 2>&1 \
            | tee ci-artifacts/lint/pre-commit.log

      - name: Upload lint logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-harness-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/lint/
          if-no-files-found: warn

  harness-tests:
    name: Harness tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare artifact directory
        run: mkdir -p ci-artifacts/harness-tests

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(tr -d '[:space:]' < .python-version)" = "${PYTHON_VERSION}"
          unset UV_PYTHON
          uv python install
          uv sync --locked --extra dev 2>&1 | tee ci-artifacts/harness-tests/uv-sync.log
          test "$(uv run --no-sync python --version)" = "Python ${PYTHON_VERSION}"

      - name: Run Eval Harness self-test with coverage
        run: |
          set -euo pipefail
          source .venv/bin/activate
          test "$(python --version)" = "Python ${PYTHON_VERSION}"
          coverage erase --rcfile=config/eval-harness-coveragerc
          coverage run --rcfile=config/eval-harness-coveragerc scripts/ci/run_eval_harness_coverage.py 2>&1 \
            | tee ci-artifacts/harness-tests/test-gdpval-cli.log
          coverage combine --rcfile=config/eval-harness-coveragerc
          coverage json --rcfile=config/eval-harness-coveragerc \
            --pretty-print -o ci-artifacts/harness-tests/coverage.json
          uv run --no-sync python scripts/ci/run_eval_harness_coverage.py \
            --check-summary ci-artifacts/harness-tests/coverage.json 2>&1 \
            | tee ci-artifacts/harness-tests/coverage-guard.log
          coverage report --rcfile=config/eval-harness-coveragerc 2>&1 \
            | tee ci-artifacts/harness-tests/coverage-report.txt

      - name: Run dependency compatibility tests
        run: |
          set -euo pipefail
          uv run --no-sync pytest \
            tests/unit_tests/test_hf_utils.py \
            tests/unit_tests/test_dataset_source.py \
            tests/unit_tests/test_dataset_orchestrator.py \
            tests/unit_tests/test_server_utils.py 2>&1 \
            | tee ci-artifacts/harness-tests/dependency-compatibility.log

      - name: Run environment inventory updater tests
        run: |
          set -euo pipefail
          uv run --no-sync pytest \
            tests/test_update_env_list.py \
            tests/unit_tests/test_update_env_list.py 2>&1 \
            | tee ci-artifacts/harness-tests/test-update-env-list.log

      - name: Upload harness test and coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-harness-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/harness-tests/
          if-no-files-found: warn

  type-check:
    name: Strict type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare artifact directory
        run: mkdir -p ci-artifacts/type-check

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(tr -d '[:space:]' < .python-version)" = "${PYTHON_VERSION}"
          unset UV_PYTHON
          uv python install
          uv sync --locked --extra dev 2>&1 | tee ci-artifacts/type-check/uv-sync.log
          test "$(uv run --no-sync python --version)" = "Python ${PYTHON_VERSION}"

      - name: Run strict Eval Harness type check
        run: |
          set -euo pipefail
          uv run --no-sync mypy --strict --explicit-package-bases --show-error-codes \
            eval_harness \
            tests/harness \
            scripts/gdpval_run_metadata.py \
            scripts/ci/run_eval_harness_coverage.py \
            scripts/ci/install_bigcodebench_grader.py \
            resources_servers/bigcodebench/app.py \
            resources_servers/bigcodebench/setup_bcb_venv.py \
            scripts/update_env_list.py \
            tests/test_update_env_list.py \
            tests/unit_tests/test_update_env_list.py \
            tests/unit_tests/test_hf_utils.py 2>&1 \
            | tee ci-artifacts/type-check/mypy.log
          # The BigCodeBench parity driver is intentionally absent until its
          # separate implementation batch; do not synthesize a CI path for it.

      - name: Upload type-check logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-harness-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/type-check/
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare artifact directory
        run: mkdir -p ci-artifacts/dependency-audit

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export locked runtime and development dependencies
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(tr -d '[:space:]' < .python-version)" = "${PYTHON_VERSION}"
          unset UV_PYTHON
          uv python install
          uv export --locked --extra dev --no-emit-project \
            --output-file ci-artifacts/dependency-audit/requirements.txt 2>&1 \
            | tee ci-artifacts/dependency-audit/uv-export.log

      - name: Validate exported dependency scope
        run: |
          set -euo pipefail
          requirements=ci-artifacts/dependency-audit/requirements.txt
          if grep -Ev '^[[:space:]]*(#|$)' "${requirements}" \
            | grep -Ein '(^|[[:space:]])(-e[[:space:]]+)?(\./|\.\./|/|file:|workspace:)'; then
            echo "uv export contains a local or workspace dependency" >&2
            exit 1
          fi
          if grep -Eiq '^nemo-gym([<=>!~]|$)' "${requirements}"; then
            echo "uv export unexpectedly contains the local project" >&2
            exit 1
          fi
          for package in openai pre-commit pytest ruff anyio; do
            if ! grep -Eiq "^${package}([<=>!~]|$)" "${requirements}"; then
              echo "uv export is missing the runtime/development dependency: ${package}" >&2
              exit 1
            fi
          done

      - name: Run pip-audit
        run: |
          set -euo pipefail
          export UV_PYTHON="${PYTHON_VERSION}"
          uvx --from "pip-audit==2.10.1" pip-audit \
            --require-hashes \
            --disable-pip \
            --strict \
            --format json \
            --aliases \
            --output ci-artifacts/dependency-audit/pip-audit.json \
            --requirement ci-artifacts/dependency-audit/requirements.txt 2>&1 \
            | tee ci-artifacts/dependency-audit/pip-audit.log

      - name: Upload dependency audit artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-harness-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/dependency-audit/
          if-no-files-found: warn

  bigcodebench-audit:
    name: BigCodeBench candidate lock audit (required, expected red)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare candidate audit artifacts
        run: mkdir -p ci-artifacts/bigcodebench-audit

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify fixed audit inputs
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(tr -d '[:space:]' < .python-version)" = "${PYTHON_VERSION}"
          unset UV_PYTHON
          uv python install
          test "$(uv run --no-project --python "${PYTHON_VERSION}" python --version)" = "Python ${PYTHON_VERSION}"
          test "$(sha256sum resources_servers/bigcodebench/requirements-grader.lock | awk '{print $1}')" = \
            "8d62cac6880124652638ff8716532d46d459aaf5cbe6e8c36b506a4d1e4de9bd"
          test "$(sha256sum scripts/ci/requirements-bwrap-build.lock | awk '{print $1}')" = \
            "32df6b18b4c96eb4146d18cd16adad24efecba5c4a5212115f5c6acea4749605"

      - name: Audit candidate grader lock (strict; expected unresolved blocker)
        run: |
          set -euo pipefail
          export UV_PYTHON="${PYTHON_VERSION}"
          uvx --from "pip-audit==2.10.1" pip-audit \
            --require-hashes \
            --disable-pip \
            --strict \
            --aliases \
            --format json \
            --output ci-artifacts/bigcodebench-audit/grader-lock-audit.json \
            --requirement resources_servers/bigcodebench/requirements-grader.lock 2>&1 \
            | tee ci-artifacts/bigcodebench-audit/grader-lock-audit.log

      - name: Audit bubblewrap build lock (strict)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          export UV_PYTHON="${PYTHON_VERSION}"
          uvx --from "pip-audit==2.10.1" pip-audit \
            --require-hashes \
            --disable-pip \
            --strict \
            --aliases \
            --format json \
            --output ci-artifacts/bigcodebench-audit/bwrap-build-lock-audit.json \
            --requirement scripts/ci/requirements-bwrap-build.lock 2>&1 \
            | tee ci-artifacts/bigcodebench-audit/bwrap-build-lock-audit.log

      - name: Upload candidate audit artifacts (always; non-acceptance evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-harness-bigcodebench-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/bigcodebench-audit/
          if-no-files-found: warn

  bigcodebench-functional-candidate:
    name: BigCodeBench functional boundary candidate (not acceptance)
    needs: bigcodebench-audit
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare candidate functional artifacts
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/bigcodebench-candidate
          printf '%s\n' \
            'manifest_role=functional-boundary-candidate' \
            'acceptance_eligible=false' \
            'dependency_audit_state=blocked' \
            'evidence_class=preparation-only; not PR04 acceptance' \
            > ci-artifacts/bigcodebench-candidate/evidence-class.txt

      - name: Resolve physical candidate resource path
        run: |
          set -euo pipefail
          resource_dir="$(cd resources_servers/bigcodebench && pwd -P)"
          test -d "${resource_dir}"
          test "${resource_dir}" = "$(readlink -f resources_servers/bigcodebench)"
          test ! -L "${resource_dir}"
          printf 'BCB_RESOURCE_DIR=%s\n' "${resource_dir}" >> "${GITHUB_ENV}"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "${UV_VERSION}"
          test "$(tr -d '[:space:]' < .python-version)" = "${PYTHON_VERSION}"
          unset UV_PYTHON
          uv python install
          uv sync --locked --extra dev 2>&1 | tee ci-artifacts/bigcodebench-candidate/uv-sync.log
          test "$(uv run --no-sync python --version)" = "Python ${PYTHON_VERSION}"
          harness_python="$(uv python find "${PYTHON_VERSION}")"
          harness_python="$(readlink -f "${harness_python}")"
          uv_bin="$(readlink -f "$(command -v uv)")"
          test -x "${harness_python}"
          test -x "${uv_bin}"
          test "$("${harness_python}" -I -B -c 'import platform; print(platform.python_version(), platform.machine())')" = \
            "3.13.14 x86_64"
          printf 'HARNESS_PYTHON=%s\n' "${harness_python}" >> "${GITHUB_ENV}"
          printf 'UV_BIN=%s\n' "${uv_bin}" >> "${GITHUB_ENV}"
          printf 'BWRAP_PATH=%s\n' "${RUNNER_TEMP}/pr04-bwrap-0.12.0/bin/bwrap" >> "${GITHUB_ENV}"
          printf 'GRADER_PYTHON=%s\n' "${RUNNER_TEMP}/pr04-bigcodebench-venv/bin/python" >> "${GITHUB_ENV}"
          printf 'RUNTIME_MANIFEST=%s\n' "${RUNNER_TEMP}/pr04-bigcodebench-runtime/runtime-manifest.json" >> "${GITHUB_ENV}"

      - name: Build pinned bubblewrap
        run: |
          set -euo pipefail
          export RUNNER_TEMP HARNESS_PYTHON UV_BIN
          bash scripts/ci/install_bubblewrap.sh 2>&1 \
            | tee ci-artifacts/bigcodebench-candidate/bubblewrap-install.log
          test -x "${BWRAP_PATH}"

      - name: Prepare candidate grader environment
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/ci/install_bigcodebench_grader.py \
            --runner-temp "${RUNNER_TEMP}" \
            --harness-python "${HARNESS_PYTHON}" \
            --resource-dir "${BCB_RESOURCE_DIR}" \
            --uv "${UV_BIN}" \
            --bwrap-path "${BWRAP_PATH}" \
            --candidate 2>&1 \
            | tee ci-artifacts/bigcodebench-candidate/grader-install.log
          test -f "${RUNTIME_MANIFEST}"

      - name: Run explicit grader dependency check
        run: |
          set -euo pipefail
          "${UV_BIN}" pip check --python "${GRADER_PYTHON}" 2>&1 \
            | tee ci-artifacts/bigcodebench-candidate/grader-pip-check.log

      - name: Read back canonical candidate runtime manifest
        run: |
          set -euo pipefail
          "${HARNESS_PYTHON}" -I -B - "${RUNTIME_MANIFEST}" "${RUNNER_TEMP}" <<'PY' \
            2>&1 | tee ci-artifacts/bigcodebench-candidate/runtime-manifest-readback.log
          from __future__ import annotations

          import hashlib
          import json
          import stat
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          runner_temp = Path(sys.argv[2]).resolve(strict=True)
          raw = manifest_path.read_bytes()
          value = json.loads(raw.decode("utf-8"))
          if not isinstance(value, dict):
              raise SystemExit("runtime manifest is not an object")
          canonical = json.dumps(
              value, allow_nan=False, ensure_ascii=True, sort_keys=True, separators=(",", ":")
          ).encode("utf-8") + b"\n"
          if raw != canonical:
              raise SystemExit("runtime manifest is not canonical")
          if stat.S_IMODE(manifest_path.stat().st_mode) != 0o444:
              raise SystemExit("runtime manifest is not read-only")
          if (
              value.get("schema_version") != 1
              or value.get("manifest_role") != "functional-boundary-candidate"
              or value.get("acceptance_eligible") is not False
              or value.get("dependency_audit_state") != "blocked"
          ):
              raise SystemExit("runtime manifest is not candidate-only")
          resource_root = runner_temp / "pr04-bigcodebench-resources"
          expected_paths = {
              "base_prefix": str(runner_temp / "pr04-cpython-3.11.16+20260901"),
              "bwrap": str(runner_temp / "pr04-bwrap-0.12.0" / "bin" / "bwrap"),
              "grader_venv": str(runner_temp / "pr04-bigcodebench-venv"),
              "nltk_data": str(resource_root / "nltk_data"),
              "resource_dir": str(resource_root),
          }
          if value.get("resolved_paths") != expected_paths or value.get("resource_dir") != str(resource_root):
              raise SystemExit("runtime manifest paths are not resolved")
          if value.get("nltk_data_path") != expected_paths["nltk_data"]:
              raise SystemExit("runtime manifest data path is not resolved")
          policy_path = resource_root / "grader-manifest.candidate.json"
          expected_policy_digest = hashlib.sha256(policy_path.read_bytes()).hexdigest()
          if value.get("candidate_manifest_sha256") != expected_policy_digest:
              raise SystemExit("runtime manifest policy binding is invalid")
          if value.get("policy_manifest_path") != str(policy_path):
              raise SystemExit("runtime manifest policy path is invalid")
          for inventory_name in (
              "prefix_inventory",
              "grader_venv_inventory",
              "resource_inventory",
              "nltk_content_inventory",
              "nltk_data_full_inventory",
          ):
              if not isinstance(value.get(inventory_name), list) or not value[inventory_name]:
                  raise SystemExit("runtime manifest inventory is missing")
          print("canonical candidate runtime metadata verified; acceptance remains blocked")
          PY
          cp -- "${RUNTIME_MANIFEST}" ci-artifacts/bigcodebench-candidate/runtime-manifest.json

      - name: Invoke public sandbox preflight (expected failure; preparation only)
        run: |
          set -euo pipefail
          uv run --no-sync python - "${RUNTIME_MANIFEST}" <<'PY' 2>&1 \
            | tee ci-artifacts/bigcodebench-candidate/public-preflight.log
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          from eval_harness.grader_sandbox import GraderSandboxSpec, preflight_bigcodebench_sandbox

          runtime = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          paths = runtime["resolved_paths"]
          spec = GraderSandboxSpec(
              resource_dir=Path(paths["resource_dir"]),
              bwrap_path=Path(paths["bwrap"]),
              grader_python=Path(paths["grader_venv"]) / "bin" / "python",
              manifest_path=Path(paths["resource_dir"]) / "grader-manifest.candidate.json",
          )
          preflight = preflight_bigcodebench_sandbox(spec)
          if not preflight.ok:
              raise RuntimeError("candidate preflight reported failure; acceptance remains blocked")
          print("candidate preflight reported success; preparation-only evidence remains non-acceptance")
          PY

      - name: Upload candidate preparation artifacts (always; non-acceptance evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-harness-bigcodebench-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/bigcodebench-candidate/
          if-no-files-found: warn
